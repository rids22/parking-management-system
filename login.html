<!DOCTYPE html>
<html>
<head>
<title>User Login</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#74ebd5,#9face6);
    margin:0;
}

.container{
    width:360px;
    margin:120px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    margin-bottom:5px;
}

p{
    color:#555;
    font-size:14px;
}

input[type="email"],
input[type="password"]{
    width:90%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
}

input[type="submit"]{
    width:95%;
    padding:10px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

input[type="submit"]:hover{
    background:#2980b9;
}

a{
    text-decoration:none;
    color:#3498db;
    font-size:14px;
}

a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Campus Parking Management System</h2>
<p>Please login to continue</p>

<form action="LoginServlet" method="post">

Email:<br>
<input type="email" name="email" required>
<br><br>

Password:<br>
<input type="password" name="password" required>
<br><br>

<input type="submit" value="Login">

</form>

<br>

<a href="register.html">New User? Register Here</a>

</div>

</body>
</html>
